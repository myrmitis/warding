name: Publish Installer

# Publishes cli.sh -- the bootstrap installer behind the documented one-liner
#
#   curl -fsSL "$BASE/cli.sh" | sh -s -- --cdn "$BASE" --channel X
#
# to the ROOT of the public distribution bucket. It is the only root object.
#
# Why this is its own workflow rather than a step in publish-cli.yml:
# publish-cli.yml is workflow_call'd by BOTH nightly.yml (schedule, checks out
# main) and release.yml (tag push, checks out the tag), once per channel. The
# installer is channel-agnostic -- ONE live copy serves nightly, insider and
# stable, because the script's only job is to resolve whichever channel feed it
# is asked for. Publishing it from there would upload it once per channel from
# whichever ref that lane happened to check out, so the live bytes would depend
# on whether a nightly or a release ran most recently. Nondeterministic, and
# silent when wrong.
#
# Ref policy: main, path-filtered. The installer's contract (resolve the feed,
# verify sha256, install) is channel-independent, so a stable user running an
# installer built from main is fine -- whereas a STALE installer is not. That
# is not hypothetical: with no publish lane at all, cli.sh drifted 11 days and
# 5 commits behind main and shipped a `beta` channel prefix nothing had ever
# published, so `--channel insider` died on an opaque CDN 403. The
# obligation this creates is real and belongs in review: the installer must
# stay backward-compatible with every live channel.
on:
  push:
    branches: [main]
    paths:
      - 'cli.sh'
      - '.github/workflows/publish-installer.yml'
  # Manual re-publish. Restricted to main by the ref guard in the first step:
  # the Actions UI lets a maintainer pick any ref, and `environment: prod` does
  # not constrain that, so the guard is what keeps this main-only. Needed
  # because the path filter above only fires when cli.sh itself changes -- a
  # republish after an infrastructure fix (e.g. the bucket grant landing) would
  # otherwise require a no-op commit to the installer.
  workflow_dispatch: {}

# Never let two publishes race the same key. cancel-in-progress stays FALSE:
# cancelling mid-publish could leave the object uploaded but unverified.
concurrency:
  group: publish-installer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-installer:
    name: Publish cli.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Upstream only, and only once a distribution bucket exists. A fork, or this
    # repository before its bucket is provisioned, has nothing to publish to;
    # skipping at the JOB level (rather than gating each step on a secret) is
    # what keeps the fail-closed behaviour below honest: with the bucket named,
    # every other missing piece fails the run loudly.
    if: github.repository == 'myrmitis/warding' && vars.CLI_DIST_BUCKET != ''
    # The R2 credentials are secrets of the prod environment, whose protection
    # rules gate every publish. See publish-cli.yml.
    environment: prod
    permissions:
      contents: read
    env:
      BUCKET: ${{ vars.CLI_DIST_BUCKET }}
      CDN_BASE: ${{ vars.CLI_CDN_BASE }}
      # The AWS CLI speaks R2's S3 API at the account endpoint; the credentials
      # are handed only to the step that uploads (see publish-cli.yml).
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL_S3: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publish the CURRENT tip of main, never the triggering event's SHA.
          # cli.sh is a mutable pointer artifact -- unlike cli/<version>/ wheels,
          # there is one live copy and the only correct content is "latest
          # reviewed main". Checking out github.sha (the default) means a
          # re-run of an older run, or a queued run executing after a newer one,
          # would overwrite newer bytes with older ones and silently roll the
          # installer back for every new user. The ref guard below still
          # restricts WHICH refs may trigger a publish; this decides WHAT gets
          # published.
          ref: main

      # Fail-closed, deliberately NOT the `if: env.HAS_SIGNING_SECRETS` skip
      # pattern the other publish lanes use. Those turn a missing secret into a
      # GREEN run that published nothing -- the exact shape of failure that let
      # this file rot unnoticed for 11 days. On main these are always
      # present, so absence is a misconfiguration and must be loud.
      - name: Verify publish configuration
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          HAS_R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY != '' && 'true' || '' }}
        run: |
          set -euo pipefail
          # main-only, enforced here rather than trusted from the trigger.
          # `push` is already filtered to main, but workflow_dispatch lets a
          # maintainer pick ANY ref in the Actions UI -- and `environment: prod`
          # does not save us unless its deployment-branch rule is set, which
          # nothing here can check. Without this check, dispatching from a
          # feature branch would check that ref out and publish its cli.sh,
          # making unreviewed shell publicly executable by every new user.
          # Fails loudly rather than skipping, so a mistaken dispatch leaves a
          # clear reason in the run log.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Refusing to publish from '${GITHUB_REF}'. cli.sh is published from main only -- it is publicly executable, so it must be reviewed and merged first."
            exit 1
          fi
          missing=""
          [[ "${R2_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]] || missing="${missing} vars.R2_ACCOUNT_ID"
          [ -n "${R2_ACCESS_KEY_ID}" ] || missing="${missing} R2_ACCESS_KEY_ID"
          [ -n "${HAS_R2_SECRET}" ] || missing="${missing} R2_SECRET_ACCESS_KEY"
          [ -n "${BUCKET}" ] || missing="${missing} vars.CLI_DIST_BUCKET"
          [ -n "${CDN_BASE}" ] || missing="${missing} vars.CLI_CDN_BASE"
          if [ -n "$missing" ]; then
            echo "::error::Installer publish is misconfigured (missing:${missing}). Refusing to report success without publishing."
            exit 1
          fi
          test -f cli.sh || { echo "::error::cli.sh is missing from the checkout."; exit 1; }

      # The strict installer ships fail-closed: until the release signing key
      # is pinned, cli.sh carries CLI_MANIFEST_KEY_ID=UNCONFIGURED
      # and refuses every install before any network I/O. That is correct as a
      # repository contract, but publishing it would replace the live
      # `curl … | sh` one-liner with a script that hard-fails on all three
      # channels. packaging/signing/README.md step 6 orders "publish the strict
      # cli.sh only after a signed channel feed exists" -- this step is the
      # mechanical enforcement of that ordering, so a merge alone can never
      # brick the documented install path.
      - name: Refuse to publish an unconfigured trust root
        run: |
          set -euo pipefail
          key_id=$(sed -n 's/^CLI_MANIFEST_KEY_ID="\(.*\)"$/\1/p' cli.sh | head -n 1)
          if [ -z "$key_id" ]; then
            echo "::error::cli.sh no longer pins CLI_MANIFEST_KEY_ID; refusing to publish an installer without a manifest trust root."
            exit 1
          fi
          if [ "$key_id" = "UNCONFIGURED" ]; then
            echo "::error::cli.sh pins CLI_MANIFEST_KEY_ID=UNCONFIGURED (fail-closed until the release key is pinned). Publishing it would brick 'curl … | sh' for every channel. Complete packaging/signing/README.md steps 1-6 and pin the real key fingerprint first."
            exit 1
          fi
          public_key_b64=$(sed -n 's/^CLI_MANIFEST_PUBLIC_KEY_B64="\(.*\)"$/\1/p' cli.sh | head -n 1)
          if [ -z "$public_key_b64" ]; then
            echo "::error::cli.sh no longer pins CLI_MANIFEST_PUBLIC_KEY_B64; refusing to publish an installer without an embedded public key."
            exit 1
          fi
          if ! printf '%s' "$public_key_b64" | base64 -d > /tmp/cli-manifest-public.pem; then
            echo "::error::cli.sh pins a malformed base64 manifest public key; refusing to publish."
            exit 1
          fi
          if ! openssl pkey -pubin -in /tmp/cli-manifest-public.pem \
              -outform DER -out /tmp/cli-manifest-public.der; then
            echo "::error::cli.sh pins an invalid manifest public key; refusing to publish."
            exit 1
          fi
          derived_key_id="sha256:$(sha256sum /tmp/cli-manifest-public.der | awk '{print $1}')"
          if [ "$key_id" != "$derived_key_id" ]; then
            echo "::error::CLI_MANIFEST_KEY_ID '${key_id}' does not match the embedded public key fingerprint '${derived_key_id}'; refusing to publish an installer that would reject every signed feed."
            exit 1
          fi
          echo "Manifest trust root pinned and self-consistent: ${key_id}"

      # A pinned key is necessary but NOT sufficient: the strict installer
      # refuses any feed it cannot verify, so publishing it while a LIVE
      # channel still serves a legacy (unsigned, or signed-by-another-key)
      # feed bricks that channel's installs just the same. Prove every live
      # feed is installable by the strict installer before replacing it.
      # A channel with NO feed (404) is skipped with a warning: it is not
      # installable by the CURRENT installer either, so publishing is not a
      # regression for it. Verification reuses the exact schema/fingerprint/
      # signature checks cli.sh itself performs (cli-manifest.py verify).
      - name: Verify every live channel feed against the pinned key
        run: |
          set -euo pipefail
          sed -n 's/^CLI_MANIFEST_PUBLIC_KEY_B64="\(.*\)"$/\1/p' cli.sh | head -n 1 \
            | base64 -d > /tmp/pinned-public.pem
          test -s /tmp/pinned-public.pem || { echo "::error::cli.sh pins no manifest public key."; exit 1; }
          for channel in nightly insider stable; do
            feed_url="${CDN_BASE}/feed/${channel}/latest-cli.json"
            status=$(curl -fsS --proto '=https' -o "/tmp/feed-${channel}.json" \
              -w '%{http_code}' "$feed_url" || true)
            if [ "$status" = "404" ] || [ "$status" = "403" ]; then
              echo "::warning::channel '${channel}' serves no feed (${status}); not installable today, so not a publish regression. Skipping."
              continue
            fi
            if [ "$status" != "200" ]; then
              echo "::error::channel '${channel}' feed fetch failed (${status}); refusing to publish without proving it verifiable."
              exit 1
            fi
            if ! python3 packaging/signing/cli-manifest.py verify \
                --manifest "/tmp/feed-${channel}.json" \
                --public-key /tmp/pinned-public.pem \
                --expected-channel "$channel" \
                --artifact-base "${CDN_BASE}"; then
              echo "::error::channel '${channel}' live feed does not verify against the pinned key. Publishing the strict installer would brick '${channel}' installs. Publish signed feeds (packaging/signing/README.md step 6) first."
              exit 1
            fi
          done

      # Catches the class of bug that motivated this lane: a syntax error or a
      # channel/prefix mismatch would otherwise reach every new user's shell.
      # The repo's own contract tests (test_publish_feed_contract.py) assert the
      # channel names match publish-cli.yml; this is the cheap shell-level gate.
      - name: Check the installer parses and rejects a bad channel
        run: |
          set -euo pipefail
          sh -n cli.sh
          if sh cli.sh --channel definitely-not-a-channel 2>/dev/null; then
            echo "::error::cli.sh accepted an unknown channel; it must fail before reaching the CDN."
            exit 1
          fi

      # `--cache-control no-cache` is load-bearing, not cosmetic. The header is
      # stored with the object and served on every response, so every cache --
      # the CDN's edge included, should a cache rule ever cover the bucket root
      # -- revalidates cli.sh instead of pinning a stale installer, and the
      # publish is live immediately.
      - name: Publish cli.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws s3api put-object \
            --bucket "${BUCKET}" \
            --key cli.sh \
            --body cli.sh \
            --content-type 'text/x-shellscript' \
            --cache-control 'no-cache' > /dev/null
          echo "Uploaded s3://${BUCKET}/cli.sh"

      # "Uploaded" is not "live and correct". Read the object back over the
      # PUBLIC CDN URL (not the S3 endpoint) and compare sha256 against the file we
      # just published, so the check exercises what a user's curl actually
      # receives -- including the CDN path and the cache headers above. Retries
      # cover edge revalidation, then fail closed.
      - name: Verify the published installer is live
        run: |
          set -euo pipefail
          EXPECTED=$(sha256sum cli.sh | awk '{print $1}')
          # The checkout above pins main's tip, which is NOT necessarily the
          # event SHA, so report what was actually published rather than
          # ${GITHUB_SHA} -- otherwise the summary names a commit whose cli.sh
          # may differ from the bytes now live.
          PUBLISHED_SHA=$(git rev-parse HEAD)
          URL="${CDN_BASE%/}/cli.sh"
          for attempt in 1 2 3 4 5; do
            ACTUAL=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}') || ACTUAL=""
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "Verified ${URL} == cli.sh@${PUBLISHED_SHA} (sha256 ${EXPECTED})"
              CACHE=$(curl -fsSI "$URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
              [ "$CACHE" = "no-cache" ] || {
                echo "::error::Published installer is served with cache-control='${CACHE}', expected 'no-cache'."
                exit 1
              }
              {
                echo "### Installer published"
                echo "- URL: \`${URL}\`"
                echo "- sha256: \`${EXPECTED}\`"
                echo "- source: \`cli.sh\` @ \`${PUBLISHED_SHA}\` (tip of main)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt ${attempt}: live sha256 '${ACTUAL:-<fetch failed>}' != '${EXPECTED}'; retrying..."
            sleep 10
          done
          echo "::error::${URL} did not converge on the published bytes. The upload may have landed without going live -- check the custom domain and any cache rule covering the bucket root."
          exit 1
