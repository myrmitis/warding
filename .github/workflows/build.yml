name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs cancel superseded revisions: only a PR's tip commit needs a verdict.
  # main does not, so let an in-flight run finish instead of killing it.
  # This does NOT produce a verdict per commit. The group still permits one
  # pending run, and GitHub evicts that pending run when a newer one queues
  # (a documented GitHub concurrency behavior). With a ~19min run and a
  # ~1.4min median merge gap, main gets periodic verdicts instead of none.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build frontend
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage frontend into package
        run: |
          rm -rf src/warding/static/dist
          mkdir -p src/warding/static
          cp -R website/dist src/warding/static/dist

      # Build the sdist too, not just the wheel: `--wheel` alone reads
      # package_data and never evaluates MANIFEST.in, so a MANIFEST regression
      # that strips the vendored native libs is INVISIBLE to a wheel-only build
      # here. The release lane builds the published wheel FROM the sdist, so
      # that regression would first surface at tag push — after it reached main.
      - name: Build wheel + sdist
        run: |
          pip install --upgrade build
          python -m build

      - name: Verify wheel installs cleanly
        run: |
          pip install dist/*.whl
          warding --version

      # The PR-time vendored-lib gate. Without it the only such gate on a PR is
      # the pytest guard, which MODELS MANIFEST.in rather than executing it — so
      # this is what proves the real artifacts. Shared with build-wheel.yml so
      # the two lanes cannot drift; a gate that diverges stops guarding without
      # ever failing.
      - name: Verify vendored native libs survived into the wheel + sdist
        run: python scripts/verify_vendored_payload.py

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 1

  # Keep the native installer fast without coupling the check to a custom UI.
  # This builds the real Windows artifact, installs it silently, verifies the
  # registration and payload, and fails if extraction exceeds five minutes.
  # It runs only when a desktop-packaging input changed (see desktop-matrix).
  build-windows-installer:
    name: Build Windows Installer (x64)
    needs: [desktop-matrix]
    if: needs.desktop-matrix.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/electron/package-lock.json

      - name: Install Electron packaging dependencies
        working-directory: website/electron
        run: npm ci --no-audit --no-fund

      - name: Create minimal backend payload
        shell: pwsh
        working-directory: website/electron
        run: |
          New-Item -ItemType Directory -Force backend-dist/warding-backend/bin | Out-Null
          @('@echo off', 'exit /b 0') | Set-Content -Encoding ascii backend-dist/warding-backend/bin/warding.cmd

      - name: Compile unsigned x64 NSIS installer
        working-directory: website/electron
        run: npx --no-install electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Enforce native installer performance ceiling
        shell: pwsh
        working-directory: website/electron
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\test-windows-installer.ps1" -SkipGatewayValidation'

      - name: Upload installer timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-performance
          retention-days: 1
          path: |
            website/electron/runtime-evidence/install-timing.txt
            website/electron/runtime-evidence/native-install-mode.png
          if-no-files-found: warn

  # Resolve which desktop platforms a pull request or a push to main builds.
  # Linux x64 ALWAYS builds: it is the cheapest leg and catches cross-platform
  # bundle breakage on every change. The macos-15 and ubuntu-22.04-arm legs and
  # the Windows installer build only when a desktop-packaging input changed,
  # because their unique coverage is packaging for that platform. The release
  # lane (build-desktop.yml) still ships every platform unconditionally.
  desktop-matrix:
    name: Resolve desktop matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      os: ${{ steps.compute.outputs.os }}
      desktop: ${{ steps.compute.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On a push, paths-filter compares against the commit before the push.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            desktop:
              - 'website/electron/**'
              - 'website/package.json'
              - 'website/package-lock.json'
              - 'packaging/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'setup.cfg'
              - '.github/scripts/test-windows-installer.ps1'
              - '.github/workflows/build.yml'
              - '.github/workflows/build-desktop.yml'
      - id: compute
        env:
          DESKTOP_CHANGED: ${{ steps.filter.outputs.desktop }}
          FILTERED: ${{ steps.filter.outcome == 'success' }}
        run: |
          # Linux x64 is unconditional. Every other platform builds when a
          # desktop-packaging path changed, or when no filter ran (fail safe).
          if [ "$FILTERED" != "true" ] || [ "$DESKTOP_CHANGED" = "true" ]; then
            echo 'desktop=true' >> "$GITHUB_OUTPUT"
            echo 'os=["macos-15","ubuntu-22.04","ubuntu-22.04-arm"]' >> "$GITHUB_OUTPUT"
          else
            echo 'desktop=false' >> "$GITHUB_OUTPUT"
            echo 'os=["ubuntu-22.04"]' >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    needs: [desktop-matrix]
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS bills at 10x, so an unbounded hang here is the costliest in the repo.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Resolved by the desktop-matrix job: Linux x64 always, plus macos-15
        # and ubuntu-22.04-arm when a desktop-packaging input changed. Linux
        # cannot be cross-compiled -- build-desktop.sh RUNS the interpreter it
        # provisions -- so each arch needs its own runner. build-desktop.yml
        # stays the release matrix that ships every platform unconditionally.
        os: ${{ fromJSON(needs.desktop-matrix.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build desktop app (PBS + uv venv)
        run: make desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload desktop artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-arm64
          retention-days: 1
          path: |
            website/electron/dist/*.dmg
            website/electron/dist/*.zip
          if-no-files-found: warn

      - name: Upload desktop artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Arch in the name: both Linux legs match `runner.os == 'Linux'`, and a
          # shared artifact name makes the two uploads collide.
          name: desktop-linux-${{ runner.arch }}
          retention-days: 1
          path: website/electron/dist/*.AppImage
          if-no-files-found: warn
